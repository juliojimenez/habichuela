name: daily

on:
  schedule:
    # 14:17 UTC every day, and again at 20:17 UTC as a safety net: GitHub's cron drifts
    # by minutes to hours and sometimes skips a slot. The pick is a no-op once the day
    # has a record, so the second run only ever refreshes stats and redeploys.
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pick and build, but do not commit data or deploy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  OCICL_VERSION: "2.20.0"
  OCICL_SHA256: "9fef518f8c20b12ce63ca6103d6224019e9b0a546ead5fc3f9a85e75b9d74050"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional. A gitlab.com token with read_api unlocks archived, mirror and issue counts.
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      # Only the systems locked in ocicl.csv, nothing global.
      OCICL_LOCAL_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends sbcl

      - name: Install ocicl
        run: |
          curl -fsSL -o /tmp/ocicl.tgz "https://github.com/ocicl/ocicl/releases/download/v${OCICL_VERSION}/ocicl-${OCICL_VERSION}-linux-amd64.tar.gz"
          echo "${OCICL_SHA256}  /tmp/ocicl.tgz" | sha256sum -c -
          mkdir -p /tmp/ocicl-dist && tar xzf /tmp/ocicl.tgz -C /tmp/ocicl-dist
          sudo install -m 0755 /tmp/ocicl-dist/ocicl /usr/local/bin/ocicl
          ocicl setup

      - name: Cache dependencies and compiled files
        uses: actions/cache@v4
        with:
          path: |
            ocicl
            ~/.cache/common-lisp
          key: ocicl-${{ hashFiles('ocicl.csv') }}-${{ hashFiles('habichuela.asd', 'src/**') }}
          restore-keys: |
            ocicl-${{ hashFiles('ocicl.csv') }}-

      - name: Read the Pages configuration (custom domain and base URL)
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Fetch the Quicklisp projects list
        run: make pool

      - name: Fetch dependencies and build the habichuela binary
        run: make bin

      - name: Pick the repository of the day
        run: bin/habichuela pick ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Refresh stale stats
        run: bin/habichuela refresh --limit 25 ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi

      - name: Build the site
        run: bin/habichuela build
        env:
          HABICHUELA_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://habichue.la' }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
